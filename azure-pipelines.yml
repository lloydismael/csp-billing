trigger:
- main

variables:
  # 1. Matches your 'Service Connection csp-billing'
  dockerRegistryServiceConnection: 'Service Connection csp-billing' 
  
  # 2. Updated to your new Docker Hub account and repository
  imageRepository: 'lloydismael12/csp-billing' 
  
  # 3. Dynamic tag starting at v6.1 and incrementing by .1 for every build
  # Format: v6. + [counter value that starts at 1]
  tag: 'v6.$(counter("version_v6", 1))'
  
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  vmImageName: 'ubuntu-latest'

  # 4. Matches your 'Consumption Service Connection'
  azureServiceConnection: 'Consumption Service Connection'
  webAppName: 'AzureConsumption'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      # Uses your self-hosted agent pool
      name: 'Default'
    steps:
    - task: Docker@2
      displayName: Build and push to Docker Hub
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy Job
    pool:
      name: 'Default'
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Azure App Service Config & Deploy'
      inputs:
        azureSubscription: $(azureServiceConnection)
        appName: $(webAppName)
        # Deploys the specific versioned tag created in the Build stage
        containers: '$(imageRepository):$(tag)'
        # Sets the port to 8000 as required by your Dockerfile [cite: 1]
        appSettings: '-WEBSITES_PORT 8000'