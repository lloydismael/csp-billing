trigger:
- main  # Change to 'master' if your branch name is master

variables:
  # 1. Matches your 'Service Connection csp-billing' (Image 4)
  dockerRegistryServiceConnection: 'Service Connection csp-billing' 
  
  # 2. Your Docker Hub username / repository name
  imageRepository: 'lloydismael/cspbilling' 
  
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  vmImageName: 'ubuntu-latest'

  # 3. Matches your 'Consumption Service Connection' (Image 2)
  azureServiceConnection: 'Consumption Service Connection'
  
  # 4. Update this with the actual name of your Azure App Service
  webAppName: 'AzureConsumption'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push to Docker Hub
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest

- stage: Deploy
  displayName: Deploy to Azure
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy Job
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: AzureWebAppContainer@1
      displayName: 'Azure App Service Config & Deploy'
      inputs:
        azureSubscription: $(azureServiceConnection)
        appName: $(webAppName)
        containers: '$(imageRepository):$(tag)'
        # Sets the port to 8000 as required by your Dockerfile
        appSettings: '-WEBSITES_PORT 8000'